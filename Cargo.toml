[workspace]
resolver = "3"
members = ["crates/driver", "crates/entity", "crates/transition"]

[workspace.package]
edition = "2024"
rust-version = "1.96"
version = "0.1.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/devrandom-labs/bombay-entity"
homepage = "https://github.com/devrandom-labs/bombay-entity"

[workspace.metadata.crane]
name = "bombay-entity"

[workspace.dependencies]
bombay-entity = { path = "crates/entity" }
bombay-machine-executor = { path = "crates/driver" }
behavior = { package = "bombay-behavior", version = "0.9.1" }
bombay-transition = { path = "crates/transition" }
hashbrown = { version = "0.17.1", default-features = false, features = ["inline-more", "raw-entry"] }
thiserror = { version = "2.0.20", default-features = false }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }
