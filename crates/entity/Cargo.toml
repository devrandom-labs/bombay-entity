[package]
name = "bombay-entity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Local entity activation, lifecycle management, and stable typed routing."
documentation = "https://docs.rs/bombay-entity"
readme = "../../README.md"
keywords = ["actor", "cqrs", "entity", "routing"]
categories = ["concurrency"]

[features]
default = ["protocol"]
protocol = ["dep:behavior"]

[dependencies]
behavior = { workspace = true, optional = true }
bombay-machine-executor.workspace = true
bombay-transition.workspace = true
thiserror.workspace = true

[dev-dependencies]
dhat = "0.3"
loom = "0.7.2"

[target.'cfg(loom)'.dependencies]
loom = "0.7.2"

[lints]
workspace = true

[[bench]]
name = "lifecycle"
harness = false

[[bench]]
name = "directory"
harness = false

[[bench]]
name = "exclusive_executor"
harness = false
